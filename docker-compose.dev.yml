services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sipon-be_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER:-sipon}"
      POSTGRES_PASSWORD: "${DB_PASS:-secret}"
      POSTGRES_DB: "${DB_NAME:-sipon}"
    ports:
      - "${DB_EXPOSE_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-sipon} -d ${DB_NAME:-sipon}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sipon-net

  # ── Redis (Cache / Session Revocation) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sipon-be_redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sipon-net

  # ── RabbitMQ (Messaging Queue) ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sipon-be_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-sipon}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-sipon}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST:-/}"
    ports:
      - "${RABBITMQ_EXPOSE_PORT:-5674}:${RABBITMQ_PORT:-5672}" # AMQP
      - "${RABBITMQ_UI_EXPOSE_PORT:-15674}:${RABBITMQ_UI_PORT:-15672}" # Management UI → http://localhost:15674
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sipon-net

  # ── App (HTTP server) ────────────────────────────────────────────────────────
  app:
    image: golang:1.25-alpine
    container_name: sipon-be_app
    restart: unless-stopped
    env_file: .env
    working_dir: /workspace
    command: ["go", "run", "./cmd/api"]
    ports:
      - "${APP_EXPOSE_PORT:-8080}:${APP_PORT:-8080}"
    volumes:
      - .:/workspace
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sipon-net

  # ── Worker (Background Scheduler) ─────────────────────────────────────────────
  worker:
    image: golang:1.25-alpine
    container_name: sipon-be_worker
    restart: unless-stopped
    env_file: .env
    working_dir: /workspace
    command: ["go", "run", "./cmd/worker"]
    ports:
      - "${WORKER_HEALTH_EXPOSE_PORT:-9090}:${WORKER_HEALTH_PORT:-9090}" # /healthz, /metrics
    volumes:
      - .:/workspace
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sipon-net

  # ── Migrate (one-shot) ───────────────────────────────────────────────────────
  migrate:
    image: golang:1.25-alpine
    container_name: sipon-be_migrate
    env_file: .env
    working_dir: /workspace
    entrypoint: ["go", "run", "./cmd/migrate"]
    volumes:
      - .:/workspace
      - ./migrations:/workspace/migrations:ro
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sipon-net
    profiles:
      - tooling

  # ── Seeder (one-shot) ───────────────────────────────────────────────────────
  seeder:
    image: golang:1.25-alpine
    container_name: sipon-be_seeder
    env_file: .env
    working_dir: /workspace
    entrypoint: ["go", "run", "./cmd/seeder"]
    volumes:
      - .:/workspace
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sipon-net
    profiles:
      - tooling

  # ── Devtools (swagger/lint) ─────────────────────────────────────────────────
  devtools:
    build:
      context: .
      dockerfile: Dockerfile
      target: devtools
    container_name: sipon-be_devtools
    working_dir: /workspace
    volumes:
      - .:/workspace
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    profiles:
      - tooling
    networks:
      - sipon-net

  # ── MinIO (Object Storage) ──────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: sipon-be_minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    ports:
      - "${MINIO_EXPOSE_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_EXPOSE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sipon-net

  # ── MinIO Init (one-shot: buat bucket) ─────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: sipon-be_minio-init
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin};
      mc mb local/${MINIO_BUCKET:-sipon-public} --ignore-existing;
      mc anonymous set public local/${MINIO_BUCKET:-sipon-public};
      mc mb local/${MINIO_PRIVATE_BUCKET:-sipon-private} --ignore-existing;
      "
    depends_on:
      minio:
        condition: service_healthy
    profiles:
      - tooling
    networks:
      - sipon-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  go_mod_cache:
  go_build_cache:

networks:
  sipon-net:
    driver: bridge
